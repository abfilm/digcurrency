server:
  port: 8080

spring:
  application:
    name: digcurrency-api
  datasource:
    url: jdbc:h2:mem:digcurrency;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

digcurrency:
  cors:
    allowed-origins: http://localhost:5173
  rates:
    enabled: true
    refresh-interval: PT5M
    coingecko:
      base-url: https://api.coingecko.com/api/v3
      api-key: ${COINGECKO_API_KEY:}
      ids:
        BTC: bitcoin
        ETH: ethereum
    ecb:
      url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
    pegs:
      EDEUR: EUR
