server:
  port: 8080

spring:
  application:
    name: digcurrency-api
  datasource:
    url: jdbc:h2:mem:digcurrency;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

digcurrency:
  cors:
    allowed-origins: http://localhost:5173
